<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Khukri</title>
  <script>
    (() => {
      const savedTheme = localStorage.getItem("khukri-theme") || "system";
      const resolvedTheme = savedTheme === "dark" || savedTheme === "light"
        ? savedTheme
        : (window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
      document.documentElement.dataset.theme = resolvedTheme;
    })();
  </script>
  <style>
    html, body {
      margin: 0;
      height: 100%;
      background: #0b0c10;
      color: #e0dcd4;
    }

    #bootSplash {
      position: fixed;
      inset: 0;
      display: grid;
      place-items: center;
      background: #0b0c10;
      color: #e0dcd4;
      font: 600 14px/1.4 "Inter", "Segoe UI", system-ui, sans-serif;
      letter-spacing: 0.02em;
      z-index: 9999;
      transition: opacity 180ms ease;
    }

    html[data-theme="light"],
    html[data-theme="light"] body,
    html[data-theme="light"] #bootSplash {
      background: #fafaf9;
      color: #1c1917;
    }

    body.app-ready #bootSplash {
      opacity: 0;
      pointer-events: none;
    }

    .boot-error {
      max-width: min(520px, calc(100vw - 48px));
      display: grid;
      gap: 8px;
      text-align: center;
    }

    .boot-error strong {
      font-size: 15px;
    }

    .boot-error span {
      color: #a9a59d;
      font-weight: 500;
      overflow-wrap: anywhere;
    }
  </style>
  <link rel="stylesheet" href="./styles.css">
</head>
<body>
  <a class="skip-link" href="#mainContent">Skip to downloads</a>
  <div id="bootSplash" role="status" aria-live="polite">Loading Khukri...</div>
  <div id="mediaOnboarding" class="onboarding-backdrop" hidden>
    <section class="onboarding-card" role="dialog" aria-modal="true" aria-labelledby="onboardingTitle" aria-describedby="onboardingBody">
      <p class="onboarding-kicker" data-i18n="onboarding.kicker"></p>
      <h2 id="onboardingTitle" class="onboarding-title" data-i18n="onboarding.title"></h2>
      <div id="onboardingBody" class="onboarding-copy">
        <p data-i18n="onboarding.body"></p>
      </div>
      <button id="acknowledgeOnboarding" class="primary-button onboarding-button" type="button" data-i18n="onboarding.accept"></button>
    </section>
  </div>
  <div class="shell">

    <aside class="sidebar" aria-label="Primary navigation">
      <div class="brand">
        <div class="brand-mark" aria-hidden="true">
          <img class="brand-icon" src="./assets/khukri-mark.svg" alt="">
        </div>
        <h1 class="brand-wordmark">Khukri</h1>
      </div>
      <nav class="nav" aria-label="Main sections">
        <button id="navDownloads" class="nav-item nav-item-active" type="button" aria-controls="downloadsView" aria-current="page">
          <svg class="nav-icon" viewBox="0 0 16 16" fill="none" aria-hidden="true">
            <path d="M8 2v7M5 6.5l3 3 3-3" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
            <path d="M2 12.5h12" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
          </svg>
          <span data-i18n="nav.downloads"></span>
        </button>
        <button id="navSettings" class="nav-item" type="button" aria-controls="settingsView">
          <svg class="nav-icon" viewBox="0 0 16 16" fill="none" aria-hidden="true">
            <circle cx="8" cy="8" r="2.2" stroke="currentColor" stroke-width="1.4"/>
            <path d="M8 1.5v2M8 12.5v2M1.5 8h2M12.5 8h2M3.4 3.4l1.4 1.4M11.2 11.2l1.4 1.4M3.4 12.6l1.4-1.4M11.2 4.8l1.4-1.4" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/>
          </svg>
          <span data-i18n="nav.settings"></span>
        </button>
      </nav>
    </aside>

    <main id="mainContent" class="main" tabindex="-1">

      <!-- Downloads view -->
      <div id="downloadsView" class="view" data-view="downloads">
        <header class="view-toolbar">
          <div class="view-heading">
            <h2 class="view-title" tabindex="-1" data-i18n="nav.downloads"></h2>
            <p class="view-subtitle" data-i18n="downloads.copy"></p>
          </div>
          <p id="formStatus" class="view-status" role="status" aria-live="polite"></p>
          <div class="toolbar-actions">
            <button id="refreshQueue" class="ghost-btn button-with-icon" type="button">
              <svg viewBox="0 0 16 16" fill="none" aria-hidden="true"><path d="M13 5.5A5.5 5.5 0 103.8 12M13 2v3.5H9.5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
              <span data-i18n="actions.refresh"></span>
            </button>
            <button id="newDownload" class="primary-button button-with-icon" type="button" aria-controls="downloadsComposer" aria-expanded="false">
              <svg viewBox="0 0 16 16" fill="none" aria-hidden="true"><path d="M8 3v10M3 8h10" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/></svg>
              <span data-i18n="actions.new_download"></span>
            </button>
          </div>
        </header>

        <div class="view-body">

          <section id="downloadsComposer" class="composer" aria-labelledby="composerTitle" hidden>
            <div class="composer-header">
              <div class="composer-heading">
                <div class="composer-heading-icon" aria-hidden="true">
                  <svg viewBox="0 0 20 20" fill="none">
                    <path d="M10 3v8M6.75 8.25 10 11.5l3.25-3.25M4 15h12" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
                  </svg>
                </div>
                <div>
                <h3 id="composerTitle" class="composer-title" data-i18n="composer.title"></h3>
                <p class="composer-copy" data-i18n="composer.copy"></p>
                </div>
              </div>
              <button id="composerClose" class="composer-close" type="button" aria-label="Close new download form">
                <svg width="10" height="10" viewBox="0 0 10 10" fill="none" aria-hidden="true">
                  <path d="M1 1l8 8M9 1L1 9" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
                </svg>
              </button>
            </div>
            <form id="downloadForm" class="download-form">
              <div class="composer-primary-fields">
                <label class="field composer-url-field">
                  <span data-i18n="composer.urlLabel"></span>
                  <input id="downloadUrl" name="downloadUrl" type="url" placeholder="https://example.com/file.zip" spellcheck="false" required>
                </label>
                <div class="composer-routing-row">
                  <label class="field composer-mode-field">
                  <span data-i18n="composer.qualityLabel"></span>
                  <select id="quality" name="quality">
                    <option value="" data-i18n="quality.direct"></option>
                    <option value="best" data-i18n="quality.best"></option>
                    <option value="1080p" data-i18n="quality.1080p"></option>
                    <option value="720p" data-i18n="quality.720p"></option>
                    <option value="audio-only" data-i18n="quality.audioOnly"></option>
                  </select>
                  </label>
                  <label class="field composer-destination-field">
                    <span data-i18n="composer.outputLabel"></span>
                    <div class="composer-destination-row">
                      <input id="outputPath" name="outputPath" type="text">
                      <button id="browseOutputPath" class="browse-btn" type="button" data-i18n="composer.browse"></button>
                    </div>
                  </label>
                </div>
              </div>

              <details class="composer-advanced">
                <summary data-i18n="composer.advanced"></summary>
                <div class="composer-advanced-grid">
                  <label class="field">
                    <span data-i18n="composer.priorityLabel"></span>
                    <select id="priority" name="priority">
                      <option value="high" data-i18n="priority.high"></option>
                      <option value="normal" selected data-i18n="priority.normal"></option>
                      <option value="low" data-i18n="priority.low"></option>
                    </select>
                  </label>
                  <label class="field">
                    <span data-i18n="composer.throttleLabel"></span>
                    <input id="throttle" name="throttle" type="number" min="0" step="1" data-i18n-placeholder="composer.unlimited" placeholder="Unlimited">
                  </label>
                </div>
              </details>

              <footer class="composer-footer">
                <p data-i18n="composer.footerHint"></p>
                <div class="composer-actions">
                  <button id="composerCancel" class="ghost-btn" type="button" data-i18n="actions.cancel"></button>
                  <button id="startDownloadButton" class="primary-button button-with-icon" type="submit">
                    <svg viewBox="0 0 16 16" fill="none" aria-hidden="true"><path d="M8 2.5v7M5.25 7 8 9.75 10.75 7M3 12.5h10" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
                    <span data-i18n="actions.start"></span>
                  </button>
                </div>
              </footer>
            </form>
          </section>

          <section id="downloadsPanel" class="queue-panel">
            <div id="emptyState" class="empty-state">
              <div class="empty-icon" aria-hidden="true">
                <svg width="22" height="22" viewBox="0 0 22 22" fill="none">
                  <path d="M11 3v10M7.5 10l3.5 3.5 3.5-3.5" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"/>
                  <path d="M3 17h16" stroke="currentColor" stroke-width="1.75" stroke-linecap="round"/>
                </svg>
              </div>
              <p class="empty-title" data-i18n="downloads.emptyTitle"></p>
              <p class="empty-hint" data-i18n="downloads.emptyCopy"></p>
              <button id="emptyNewDownload" class="primary-button button-with-icon" type="button" aria-controls="downloadsComposer">
                <svg viewBox="0 0 16 16" fill="none" aria-hidden="true"><path d="M8 3v10M3 8h10" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/></svg>
                <span data-i18n="actions.new_download"></span>
              </button>
            </div>
            <div id="downloadsList" class="downloads-list" hidden></div>
          </section>

        </div>
      </div>

      <!-- Settings view -->
      <div id="settingsView" class="view view--settings" data-view="settings" hidden>
        <header class="view-toolbar">
          <div class="view-heading">
            <h2 class="view-title" tabindex="-1" data-i18n="settings.title"></h2>
            <p class="view-subtitle" data-i18n="settings.copy"></p>
          </div>
          <div class="toolbar-actions">
            <p id="settingsStatus" class="view-status view-status--inline" aria-live="polite"></p>
            <button id="saveSettingsButton" class="primary-button" form="settingsForm" type="submit" data-i18n="settings.save"></button>
          </div>
        </header>

        <div class="view-body">
          <form id="settingsForm" class="settings-grid">

            <article class="settings-section">
              <div class="settings-section-head">
                <div class="settings-section-label-group">
                  <div class="settings-section-icon" aria-hidden="true">
                    <svg width="14" height="14" viewBox="0 0 16 16" fill="none">
                      <path d="M2 4h12M2 8h8M2 12h5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
                    </svg>
                  </div>
                  <span class="section-label" data-i18n="settings.general.title"></span>
                </div>
                <button class="reset-link reset-section" type="button" data-section="general" data-i18n="settings.reset"></button>
              </div>
              <div class="settings-section-body">
                <div class="field field-with-browse">
                  <span id="settingsDefaultPathLabel" data-i18n="settings.general.pathLabel"></span>
                  <div class="input-browse-row">
                    <input id="settingsDefaultPath" name="generalDefaultPath" type="text" aria-labelledby="settingsDefaultPathLabel" aria-describedby="settingsDefaultPathHint">
                    <button id="browseDefaultPath" class="browse-btn" type="button" aria-label="Browse for folder">
                      <svg width="14" height="14" viewBox="0 0 16 16" fill="none" aria-hidden="true">
                        <path d="M1.5 4.5h4l1.5 2h7.5v7H1.5z" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round"/>
                      </svg>
                      Browse
                    </button>
                  </div>
                  <p id="settingsDefaultPathHint" class="field-hint" data-i18n="settings.general.pathHint"></p>
                </div>
                <label class="field">
                  <span data-i18n="settings.general.concurrentLabel"></span>
                  <input id="settingsMaxConcurrent" name="generalMaxConcurrent" type="number" min="1" max="16" step="1">
                  <p class="field-hint" data-i18n="settings.general.concurrentHint"></p>
                </label>
                <label class="field checkbox-field">
                  <input id="settingsYtdlpAutoUpdate" name="settingsYtdlpAutoUpdate" type="checkbox">
                  <span data-i18n="settings.general.ytdlpAutoUpdateLabel"></span>
                </label>
                <label class="field">
                  <span data-i18n="settings.general.browserSessionLabel"></span>
                  <select id="settingsBrowserSession" name="settingsBrowserSession">
                    <option value="" data-i18n="settings.general.browserSessionOff"></option>
                    <option value="chrome">Chrome</option>
                    <option value="edge">Microsoft Edge</option>
                    <option value="brave">Brave</option>
                    <option value="firefox">Firefox</option>
                    <option value="safari">Safari</option>
                    <option value="chromium">Chromium</option>
                    <option value="opera">Opera</option>
                    <option value="vivaldi">Vivaldi</option>
                    <option value="whale">Whale</option>
                  </select>
                  <p class="field-hint" data-i18n="settings.general.browserSessionHint"></p>
                </label>
                <div class="field">
                  <span data-i18n="settings.general.ytdlpActionsLabel"></span>
                  <div class="settings-inline-action">
                    <button id="checkYtdlpNow" class="ghost-btn" type="button" data-i18n="settings.general.ytdlpCheckNow"></button>
                  </div>
                </div>
              </div>
            </article>

            <article class="settings-section">
              <div class="settings-section-head">
                <div class="settings-section-label-group">
                  <div class="settings-section-icon settings-section-icon--violet" aria-hidden="true">
                    <svg width="14" height="14" viewBox="0 0 16 16" fill="none">
                      <circle cx="8" cy="8" r="5.5" stroke="currentColor" stroke-width="1.4"/>
                      <path d="M8 5v3.5l2 2" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/>
                    </svg>
                  </div>
                  <span class="section-label" data-i18n="settings.performance.title"></span>
                </div>
                <button class="reset-link reset-section" type="button" data-section="performance" data-i18n="settings.reset"></button>
              </div>
              <div class="settings-section-body">
                <label class="field">
                  <span data-i18n="settings.performance.threadsLabel"></span>
                  <input id="settingsThreadOverride" name="performanceThreadOverride" type="number" min="1" max="128" step="1" placeholder="Auto">
                  <p class="field-hint" data-i18n="settings.performance.threadsHint"></p>
                </label>
                <label class="field">
                  <span data-i18n="settings.performance.bandwidthLabel"></span>
                  <input id="settingsBandwidthCap" name="performanceBandwidthCap" type="number" min="0" step="1" placeholder="Leave blank for unlimited">
                  <p class="field-hint" data-i18n="settings.performance.bandwidthHint"></p>
                </label>
              </div>
            </article>

            <article class="settings-section">
              <div class="settings-section-head">
                <div class="settings-section-label-group">
                  <div class="settings-section-icon settings-section-icon--amber" aria-hidden="true">
                    <svg width="14" height="14" viewBox="0 0 16 16" fill="none">
                      <rect x="2" y="3" width="12" height="11" rx="1.5" stroke="currentColor" stroke-width="1.4"/>
                      <path d="M5 1v3M11 1v3M2 7h12" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/>
                    </svg>
                  </div>
                  <span class="section-label" data-i18n="settings.scheduler.title"></span>
                </div>
                <button class="reset-link reset-section" type="button" data-section="scheduler" data-i18n="settings.reset"></button>
              </div>
              <div class="settings-section-body">
                <label class="field checkbox-field">
                  <input id="settingsSchedulerEnabled" name="schedulerEnabled" type="checkbox">
                  <span data-i18n="settings.scheduler.enabledLabel"></span>
                </label>
                <div class="field-row">
                  <label class="field">
                    <span data-i18n="settings.scheduler.startLabel"></span>
                    <input id="settingsSchedulerStart" name="schedulerStart" type="number" min="0" max="23" step="1">
                  </label>
                  <label class="field">
                    <span data-i18n="settings.scheduler.endLabel"></span>
                    <input id="settingsSchedulerEnd" name="schedulerEnd" type="number" min="0" max="23" step="1">
                  </label>
                </div>
                <p class="field-hint" data-i18n="settings.scheduler.hint"></p>
              </div>
            </article>

            <article class="settings-section">
              <div class="settings-section-head">
                <div class="settings-section-label-group">
                  <div class="settings-section-icon settings-section-icon--sky" aria-hidden="true">
                    <svg width="14" height="14" viewBox="0 0 16 16" fill="none">
                      <circle cx="8" cy="8" r="2" stroke="currentColor" stroke-width="1.4"/>
                      <path d="M8 2v2M8 12v2M2 8h2M12 8h2M3.9 3.9l1.4 1.4M10.7 10.7l1.4 1.4M3.9 12.1l1.4-1.4M10.7 5.3l1.4-1.4" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/>
                    </svg>
                  </div>
                  <span class="section-label" data-i18n="settings.proxy.title"></span>
                </div>
                <button class="reset-link reset-section" type="button" data-section="proxy" data-i18n="settings.reset"></button>
              </div>
              <div class="settings-section-body">
                <label class="field checkbox-field">
                  <input id="settingsProxyEnabled" name="proxyEnabled" type="checkbox">
                  <span data-i18n="settings.proxy.enabledLabel"></span>
                </label>
                <label id="settingsProxyUrlField" class="field">
                  <span data-i18n="settings.proxy.urlLabel"></span>
                  <input id="settingsProxyUrl" name="proxyUrl" type="text" placeholder="http://127.0.0.1:8080">
                  <p class="field-hint" data-i18n="settings.proxy.urlHint"></p>
                </label>
              </div>
            </article>

            <article class="settings-section">
              <div class="settings-section-head">
                <div class="settings-section-label-group">
                  <div class="settings-section-icon settings-section-icon--rose" aria-hidden="true">
                    <svg width="14" height="14" viewBox="0 0 16 16" fill="none">
                      <path d="M3 4.5A1.5 1.5 0 014.5 3h7A1.5 1.5 0 0113 4.5v7a1.5 1.5 0 01-1.5 1.5h-7A1.5 1.5 0 013 11.5v-7z" stroke="currentColor" stroke-width="1.4"/>
                      <path d="M6 8h4M8 6v4" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/>
                    </svg>
                  </div>
                  <span class="section-label" data-i18n="settings.appearance.title"></span>
                </div>
                <button class="reset-link reset-section" type="button" data-section="appearance" data-i18n="settings.reset"></button>
              </div>
              <div class="settings-section-body">
                <label class="field">
                  <span data-i18n="settings.appearance.themeLabel"></span>
                  <select id="settingsTheme" name="appearanceTheme">
                    <option value="system" data-i18n="settings.appearance.themeSystem"></option>
                    <option value="dark" data-i18n="settings.appearance.themeDark"></option>
                    <option value="light" data-i18n="settings.appearance.themeLight"></option>
                  </select>
                  <p class="field-hint" data-i18n="settings.appearance.themeHint"></p>
                </label>
              </div>
            </article>

          </form>
        </div>
      </div>

    </main>
  </div>

  <script type="module" src="./app.js"></script>
</body>
</html>

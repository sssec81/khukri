<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Download with Khukri</title>
    <style>
        :root {
            --kh-bg: #1c1917;
            --kh-surface: #292524;
            --kh-surface-hi: #44403c;
            --kh-text: #fafaf9;
            --kh-text-soft: #d6d3d1;
            --kh-text-muted: #a8a29e;
            --kh-accent: #818cf8;
            --kh-accent-hover: #a5b4fc;
            --kh-accent-bg: rgba(99, 102, 241, 0.16);
            --kh-danger: #f87171;
            --kh-border: rgba(255, 255, 255, 0.09);
            --kh-border-strong: rgba(255, 255, 255, 0.14);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
            color: var(--kh-text);
        }

        *, *::before, *::after { box-sizing: border-box; }

        html, body {
            width: 100%;
            min-width: 320px;
            height: 100%;
            min-height: 300px;
            margin: 0;
        }

        body {
            display: grid;
            place-items: center;
            padding: 20px;
            overflow: auto;
            background:
                radial-gradient(circle at 78% 0%, rgba(99, 102, 241, 0.17), transparent 42%),
                radial-gradient(circle at 14% 100%, rgba(56, 189, 248, 0.07), transparent 38%),
                var(--kh-bg);
            color: var(--kh-text);
            font-size: 14px;
            line-height: 1.5;
        }

        button, input { touch-action: manipulation; }

        #app {
            width: min(100%, 460px);
            padding: 20px;
            border: 1px solid var(--kh-border);
            border-radius: 16px;
            background: rgba(41, 37, 36, 0.88);
            box-shadow:
                0 24px 70px rgba(0, 0, 0, 0.42),
                inset 0 1px 0 rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(24px) saturate(150%);
            -webkit-backdrop-filter: blur(24px) saturate(150%);
        }

        .header {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 18px;
        }

        .logo {
            width: 36px;
            height: 36px;
            flex: 0 0 auto;
            filter: drop-shadow(0 7px 14px rgba(99, 102, 241, 0.22));
        }

        .header-text {
            display: flex;
            flex-direction: column;
            min-width: 0;
        }

        .header-title {
            color: var(--kh-text);
            font-size: 14px;
            font-weight: 700;
            letter-spacing: -0.01em;
        }

        .header-sub {
            color: var(--kh-text-muted);
            font-size: 12px;
        }

        .file-info {
            display: flex;
            flex-direction: column;
            gap: 6px;
            margin-bottom: 14px;
            padding: 13px 14px;
            border: 1px solid var(--kh-border);
            border-radius: 12px;
            background: rgba(255, 255, 255, 0.035);
            box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.025);
        }

        .file-name {
            overflow: hidden;
            color: var(--kh-text);
            font-size: 13px;
            font-weight: 650;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .file-meta {
            display: flex;
            gap: 8px;
            min-width: 0;
            color: var(--kh-text-muted);
            font-size: 11px;
        }

        .file-meta span {
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        #filesize {
            flex: 0 0 auto;
            padding-right: 8px;
            border-right: 1px solid var(--kh-border);
            font-variant-numeric: tabular-nums;
        }

        #fileurl { flex: 1; }

        .remember-row {
            display: flex;
            align-items: center;
            gap: 9px;
            min-height: 36px;
            margin-bottom: 14px;
            color: var(--kh-text-muted);
            font-size: 12px;
            cursor: pointer;
            user-select: none;
        }

        .remember-row:hover { color: var(--kh-text-soft); }

        .remember-row input {
            width: 16px;
            height: 16px;
            margin: 0;
            accent-color: var(--kh-accent);
            cursor: pointer;
        }

        .actions {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
        }

        .btn {
            min-height: 44px;
            padding: 0 16px;
            border: 1px solid transparent;
            border-radius: 10px;
            font: inherit;
            font-size: 13px;
            font-weight: 700;
            cursor: pointer;
            transition: background-color 180ms ease, border-color 180ms ease,
                        color 180ms ease, transform 140ms ease, box-shadow 180ms ease;
        }

        .btn:hover:not(:disabled) { transform: translateY(-1px); }
        .btn:active:not(:disabled) { transform: scale(0.98); }
        .btn:disabled { opacity: 0.48; cursor: not-allowed; }

        .btn:focus-visible,
        .remember-row input:focus-visible {
            outline: 3px solid rgba(129, 140, 248, 0.38);
            outline-offset: 2px;
        }

        .btn-primary {
            background: var(--kh-accent);
            color: #17151f;
            box-shadow: 0 8px 22px rgba(99, 102, 241, 0.24);
        }

        .btn-primary:hover:not(:disabled) { background: var(--kh-accent-hover); }

        .btn-secondary {
            border-color: var(--kh-border-strong);
            background: rgba(255, 255, 255, 0.055);
            color: var(--kh-text-soft);
        }

        .btn-secondary:hover:not(:disabled) {
            border-color: rgba(255, 255, 255, 0.2);
            background: rgba(255, 255, 255, 0.09);
            color: var(--kh-text);
        }

        .error-state {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 220px;
            gap: 12px;
            text-align: center;
        }

        .error-icon {
            display: grid;
            width: 40px;
            height: 40px;
            place-items: center;
            border: 1px solid rgba(248, 113, 113, 0.22);
            border-radius: 12px;
            background: rgba(220, 38, 38, 0.14);
            color: var(--kh-danger);
        }

        .error-icon svg { width: 20px; height: 20px; }

        .error-msg {
            max-width: 34ch;
            margin: 0;
            color: var(--kh-text-muted);
            font-size: 12px;
        }

        .error-state .btn { width: min(100%, 180px); }

        @media (max-width: 420px) {
            body { padding: 12px; }
            #app { padding: 16px; }
            .actions { grid-template-columns: 1fr; }
            .btn-primary { order: -1; }
        }

        @media (prefers-reduced-motion: reduce) {
            *, *::before, *::after {
                scroll-behavior: auto !important;
                transition-duration: 0.01ms !important;
            }
        }
    </style>
</head>
<body>
    <main id="app">
        <div class="header">
            <svg class="logo" viewBox="0 0 36 36" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
                <rect width="36" height="36" rx="10" fill="#292524"/>
                <rect x="0.5" y="0.5" width="35" height="35" rx="9.5" stroke="white" stroke-opacity="0.12"/>
                <path d="M8 25.5 23 9.5l5 2.8L14 28Z" fill="#818CF8"/>
                <path d="m23 9.5 5 2.8-1.6 1.2-4.6-2.6Z" fill="#A5B4FC"/>
                <rect x="7" y="24.5" width="9" height="3" rx="1.5" fill="#10B981"/>
            </svg>
            <div class="header-text">
                <span class="header-title">Download with Khukri</span>
                <span class="header-sub">Choose how to handle this file</span>
            </div>
        </div>

        <section class="file-info" aria-label="Download details">
            <div class="file-name" id="filename">Loading…</div>
            <div class="file-meta">
                <span id="filesize">—</span>
                <span id="fileurl" title="">—</span>
            </div>
        </section>

        <label class="remember-row">
            <input type="checkbox" id="rememberChk" />
            Remember this choice
        </label>

        <div class="actions">
            <button class="btn btn-primary" id="startBtn">Open in Khukri</button>
            <button class="btn btn-secondary" id="keepBtn">Use Browser</button>
        </div>
    </main>

    <script src="prompt.js"></script>
</body>
</html>
